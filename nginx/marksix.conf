# ==============================================================================
# 香港六合彩 (Mark Six) Nginx 反向代理配置模板
# ==============================================================================

# 【模式 A：443 已被占用，使用独立端口 (如 8443) 并复用现存 SSL 证书】
# 适用于：443 端口被 cdn-cf-optimizer 等服务占用，六合彩使用独立端口 https://yourdomain.com:8443
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name yourdomain.com; # 请替换为您实际的域名(需与 cdn-cf-optimizer 证书匹配)

    # 复用服务器上已有的证书文件路径 (例如 cdn-cf-optimizer 的证书)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # 常用安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ==============================================================================
# 【模式 B (推荐)：免改端口！直接在现有 443 服务中追加子路径或二级域名反代】
# ==============================================================================
# 如果您现有的 443 端口使用的是 Nginx (例如 /etc/nginx/conf.d/cfsub.conf)，
# 您无需额外监听新端口，直接在现有的 server { listen 443 ... } 块中追加以下 location：
#
#   location /marksix/ {
#       proxy_pass http://127.0.0.1:8000/;
#       proxy_http_version 1.1;
#       proxy_set_header Host $host;
#       proxy_set_header X-Real-IP $remote_addr;
#       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#   }
#
# 如果您现有 443 服务使用的是 Caddy (如 cdn-cf-optimizer 的 Caddyfile)，
# 直接在 Caddyfile 域名大括号内追加：
#
#   handle /marksix/* {
#       reverse_proxy 127.0.0.1:8000
#   }
#
# 这样访问 https://yourdomain.com/marksix/ 即可，完全不需要端口号，也自动继承已有证书！
